<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<title>App Downloads</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #05060d; color: #f4f6ff; font-family: "Poppins", "Segoe UI", Roboto, Arial, sans-serif; }
  body { padding: 3vw 4vw 6vw; min-height: 100vh; overflow-x: hidden; }

  /* Drifting colour orbs. Only transform is animated so it stays smooth on TV sticks. */
  .bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; z-index: 0; pointer-events: none; }
  .orb { position: absolute; width: 70vw; height: 70vw; border-radius: 50%; will-change: transform; }
  .orb.a { top: -30vw; left: -20vw; background: radial-gradient(circle, rgba(124, 58, 237, 0.55) 0%, rgba(124, 58, 237, 0) 65%); animation: drift-a 22s ease-in-out infinite alternate; }
  .orb.b { bottom: -35vw; right: -20vw; background: radial-gradient(circle, rgba(14, 165, 233, 0.5) 0%, rgba(14, 165, 233, 0) 65%); animation: drift-b 28s ease-in-out infinite alternate; }
  .orb.c { top: 20vh; left: 30vw; width: 50vw; height: 50vw; background: radial-gradient(circle, rgba(236, 72, 153, 0.35) 0%, rgba(236, 72, 153, 0) 65%); animation: drift-c 34s ease-in-out infinite alternate; }
  @keyframes drift-a { to { transform: translate(35vw, 25vh) scale(1.25); } }
  @keyframes drift-b { to { transform: translate(-40vw, -30vh) scale(1.15); } }
  @keyframes drift-c { to { transform: translate(-25vw, 20vh) scale(0.8); } }

  #gate, #main { position: relative; z-index: 1; }

  #gate { min-height: 85vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .panel { background: rgba(255, 255, 255, 0.06); border: 0.15vw solid rgba(255, 255, 255, 0.14); border-radius: 2vw; padding: 3.5vw 5vw; box-shadow: 0 2vw 6vw rgba(0, 0, 0, 0.5); }
  #gate h1 { font-size: 3vw; font-weight: 700; margin: 0 0 2vw; letter-spacing: 0.1vw; }
  #pass, #gate button { font-family: inherit; font-size: 2.4vw; padding: 1vw 2vw; border-radius: 5vw; border: 0.25vw solid rgba(255, 255, 255, 0.2); margin: 0.6vw; transition: box-shadow 0.15s, border-color 0.15s, transform 0.15s; }
  #pass { width: 36vw; background: rgba(0, 0, 0, 0.35); color: #fff; text-align: center; letter-spacing: 0.4vw; text-transform: uppercase; }
  #gate button { background: linear-gradient(90deg, #7c3aed, #0ea5e9); color: #fff; font-weight: 700; cursor: pointer; padding: 1vw 5vw; }
  #gate-error { color: #ff7a7a; font-size: 1.8vw; visibility: hidden; margin-top: 1vw; }
  #pass:focus, #gate button:focus { outline: none; border-color: #fff; box-shadow: 0 0 2.5vw rgba(125, 211, 252, 0.8); }
  #gate button:focus { transform: scale(1.06); }

  #main { display: none; }
  .banner { background: linear-gradient(90deg, #ff2d55, #ff7a18, #ff2d55); background-size: 200% 100%; color: #fff; font-weight: 800; text-align: center; font-size: 2.3vw; line-height: 1.3; letter-spacing: 0.05vw; padding: 1.5vw 2vw; border-radius: 5vw; margin-bottom: 1.8vw; animation: slide 6s linear infinite, pulse 2.4s ease-in-out infinite; }
  @keyframes slide { to { background-position: 200% 0; } }
  @keyframes pulse { 0%, 100% { box-shadow: 0 0 1.5vw rgba(255, 45, 85, 0.45); } 50% { box-shadow: 0 0 4vw rgba(255, 122, 24, 0.85); } }

  h2 { text-transform: uppercase; font-size: 2.2vw; font-weight: 700; margin: 4vw 0 1.2vw; padding-left: 1.2vw; border-left: 0.5vw solid #7c3aed; line-height: 1.2; }
  .row { display: flex; flex-wrap: wrap; margin: 0 -1vw; }
  .card { width: 25%; padding: 1vw; color: inherit; text-decoration: none; outline: none; display: block; animation: rise 0.5s ease-out both; }
  @keyframes rise { from { opacity: 0; transform: translateY(2vw); } }
  .tile { background: rgba(255, 255, 255, 0.06); border: 0.3vw solid rgba(255, 255, 255, 0.1); border-radius: 1.6vw; overflow: hidden; transition: transform 0.18s, box-shadow 0.18s, border-color 0.18s; }
  .art { position: relative; padding-top: 56.25%; background: rgba(0, 0, 0, 0.35); font-size: 7vw; font-weight: 800; color: rgba(255, 255, 255, 0.25); }
  .art img, .art span { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
  .art img { object-fit: cover; }
  .art span { display: flex; align-items: center; justify-content: center; }
  .label { text-transform: uppercase; text-align: center; font-size: 1.5vw; font-weight: 600; line-height: 1.25; padding: 1vw 0.8vw 1.1vw; }

  .card:focus .tile, .card:hover .tile { transform: scale(1.08); border-color: #fff; box-shadow: 0 0 0 0.3vw rgba(125, 211, 252, 0.9), 0 0 4vw rgba(124, 58, 237, 0.9); background: rgba(255, 255, 255, 0.14); }
  .card:focus, .card:hover { position: relative; z-index: 2; }

  @media (prefers-reduced-motion: reduce) {
    .orb, .banner, .card { animation: none; }
  }

  @media (max-width: 700px) {
    .card { width: 50%; }
    .banner, h2, #gate h1 { font-size: 5vw; }
    .banner { border-radius: 4vw; padding: 3vw; }
    .label, #gate-error { font-size: 3.4vw; }
    #pass, #gate button { font-size: 5vw; }
    #pass { width: 70vw; }
  }
</style>
</head>
<body>
<div class="bg"><div class="orb a"></div><div class="orb b"></div><div class="orb c"></div></div>

<div id="gate">
  <div class="panel">
  <h1>Enter Password</h1>
  <form id="gate-form" autocomplete="off">
    <input id="pass" class="focusable" type="text" autocapitalize="characters" autocorrect="off" spellcheck="false" aria-label="Password">
    <br>
    <button class="focusable" type="submit">ENTER</button>
  </form>
  <div id="gate-error">Wrong password, try again</div>
  </div>
</div>

<div id="main">
  <section>
    <div class="banner">MUST INSTALL THESE TOP 4 APPS, EACH APP IS A DIFFERENT PROVIDER</div>
    <div class="row" id="top-row"></div>
  </section>
  <section>
    <h2>Alternative VOD Apps</h2>
    <div class="row" id="vod-row"></div>
  </section>
  <section>
    <h2>Other Apps</h2>
    <div class="row" id="other-row"></div>
  </section>
</div>

<script src="sha256.js"></script>
<script src="apps.js"></script>
<script src="app.js"></script>
</body>
</html>
